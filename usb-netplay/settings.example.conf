# USB Netplay settings (optional): copy this file to settings.conf next to it
# and edit that copy, so an update can't overwrite it. One KEY=VALUE per line.
#
# FALLBACK_HOST: where RetroArch's pre-filled netplay host (the name
# usb-netplay) points while no cable is plugged in, e.g. the Wi-Fi address of
# the handheld you usually play against. Empty: nothing, so "Connect to
# Netplay Host" only works over the cable (the host list still works on Wi-Fi).
FALLBACK_HOST=
#
# NOTIFY: "no" turns off the short notices in the menu when the cable link
# comes up or goes down (ROCKNIX, AmberELEC, KNULLI, Batocera).
NOTIFY=
#
# GBLINK: "no" leaves the Game Boy core's link settings alone. Otherwise, on
# ROCKNIX, KNULLI and Batocera, USB Netplay sets Gambatte's network Game Link
# whenever a cable link is up: the USB host is the link server, the USB device
# connects to it.
GBLINK=
